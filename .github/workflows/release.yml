name: Release and Publish

on:
  push:
    tags:
      - '*'

jobs:
  Get-CI-Image-Tag:
    uses: opensearch-project/opensearch-build/.github/workflows/get-ci-image-tag.yml@main
    with:
      product: opensearch

  release:
    needs: Get-CI-Image-Tag
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.Get-CI-Image-Tag.outputs.ci-image-version-linux }}
      options: ${{ needs.Get-CI-Image-Tag.outputs.ci-image-start-options }}
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
      JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8
    permissions:
      contents: write
    steps:
      - name: Run start commands
        run: ${{ needs.Get-CI-Image-Tag.outputs.ci-image-start-command }}
      
      - uses: actions/checkout@v6
      
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: 21
      
      - name: Build with Gradle
        run: |
          chown -R 1000:1000 `pwd`
          su `id -un 1000` -c "./gradlew --info build -x test"
      
      - name: Create Artifact Path
        run: |
          mkdir -p prometheus-exporter-artifacts
          cp -r ./build/distributions/*.zip prometheus-exporter-artifacts/
          ls -la prometheus-exporter-artifacts/
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: prometheus-exporter-artifacts/*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
