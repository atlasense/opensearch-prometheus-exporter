---
"Index level statistics (index_completion_* must NOT be exposed)":

  # Upstream asserted these metrics were present. This fork deliberately never
  # requests completion stats, because computing them force-loads every
  # completion-suggester FST onto the heap where it stays pinned for the life of
  # the segment reader. The assertion is inverted so that reverting the opt-out,
  # or losing it in a merge from upstream, fails the build.

  # -----------------------------------
  # We expect no indices in the cluster
  - do:
      indices.refresh: { allow_no_indices: true }

  - do:
      cluster.stats: {}

  - match: { indices.count: 0 }

  - do:
      index:
        index:  twitter
        id:     1
        body:   { foo: bar }

  - do:
      indices.refresh: { allow_no_indices: true }

  # -----------------------------------
  # Index level metrics are on by default, so the index is being reported on --
  # but the completion gauge specifically must be absent.

  - do:
      prometheus.metrics: {}

  # Sanity check: index level stats really are present for this index, so the
  # assertion below is testing the completion opt-out and not an empty response.
  - match:
      $body: |
        /[\s\S]*opensearch_index_indexing_index_count\{[\s\S]*index="twitter"[\s\S]*/

  # [\s\S] rather than . so the negative lookahead spans the whole payload
  # regardless of how the assertion compiles its pattern.
  - match:
      $body: |
        /^(?![\s\S]*opensearch_index_completion_size_bytes)[\s\S]*$/

  # The node level gauge is dropped by the same patch.
  - match:
      $body: |
        /^(?![\s\S]*opensearch_indices_completion_size_bytes)[\s\S]*$/
